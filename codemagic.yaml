# Codemagic — iOS TestFlight build for Stock Room (Flutter in mobile/)
# Docs: https://docs.codemagic.io/yaml/yaml-getting-started/
# Signing: uses uploaded identities in Codemagic → Code signing identities
#   Certificate: StockRoomDistribution (production)
#   Profile:     StockRoomDistribution (app_store, com.cafecount.cafecount)

workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Name must match Developer Portal integration in Codemagic settings
      app_store_connect: CafeCount
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.cafecount.cafecount
      flutter: stable
      xcode: latest
      cocoapods: default
      vars:
        API_BASE: https://cafecount.onrender.com/api/v1
    scripts:
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Add certificates to keychain
        script: |
          keychain add-certificates
      - name: Use provisioning profiles
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          cd mobile
          flutter pub get
      - name: Install CocoaPods dependencies
        script: |
          cd mobile/ios
          pod install
      - name: Flutter build IPA
        script: |
          cd mobile
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist \
            --dart-define=API_BASE="$API_BASE"
    artifacts:
      - mobile/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
